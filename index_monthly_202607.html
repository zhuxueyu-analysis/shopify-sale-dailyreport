<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026年7月经营月报</title><style>:root{color-scheme:light dark;--bg:light-dark(#f3f6fa,#0d0f12);--side:#121a29;--side2:#202b3f;--fg:#f7f9fc;--muted:#9aa9bf;--red:#ff4d5e;--blue:#3b82f6}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg)}.shell{height:100%;display:grid;grid-template-columns:230px 1fr}.side{padding:20px 14px;background:var(--side);color:var(--fg);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 7px 18px;border-bottom:1px solid #2d3748}.logo{width:36px;height:36px;border-radius:10px;background:#f5a000;color:#111827;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}.menu{margin-top:10px;display:grid;gap:6px}.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:9px;padding:12px 10px;background:transparent;color:var(--fg);cursor:pointer;text-align:left;font-size:14px}.menu button span:last-child{font-size:11px;color:#8fb4ef}.menu button.active{background:var(--side2);box-shadow:inset 3px 0 var(--red)}.hint{margin-top:auto;padding:12px 8px;color:var(--muted);font-size:11px;line-height:1.55}.content{min-width:0;height:100%}iframe{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:700px){.shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{padding:10px 12px}.brand{padding:0 2px 9px}.logo{width:31px;height:31px}.menu{display:grid;grid-template-columns:1fr 1fr;margin-top:8px}.menu button{padding:9px}.hint{display:none}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">BI</div><div><b>2026年7月经营月报</b><small>整体经营 × 品类运营</small></div></div><nav class="menu"><button class="active" data-page="index_mon
